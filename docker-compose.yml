services:
  postgres:
    image: postgres:16-alpine
    container_name: azuretti-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

  minio:
    image: minio/minio:latest
    container_name: azuretti-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://storage.azuretti.313communications.com
      MINIO_BROWSER_REDIRECT_URL: https://minio.azuretti.313communications.com

    expose:
      - "9000"
      - "9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s    # give MinIO time to boot before first check
    
    networks: [appnet]

  minio-init:
    image: minio/mc:latest
    container_name: azuretti-minio-init
    depends_on: { minio: { condition: service_healthy } }
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing minio/shipment-docs;
        mc mb --ignore-existing minio/warehouse-receipts;
        mc mb --ignore-existing minio/azuretti-public;
        mc anonymous set public minio/azuretti-public;
        mc anonymous set public minio/shipment-docs;
        echo 'Buckets ready';
      "
    networks: [appnet]

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: azuretti-db-init
    env_file:
      - .env
    environment: { DATABASE_URL: "${DATABASE_URL}" }
    depends_on: { postgres: { condition: service_healthy } }
    command: npm run db:setup
    networks: [appnet]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # No target specified here = defaults to the last stage (runner/standalone)
    container_name: azuretti-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    ports: ["3000:3000"]
    networks: [appnet]

volumes:
  postgres_data:
  minio_data:

networks:
  appnet:
    driver: bridge
